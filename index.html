<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IP-01 · p5.js 双联作</title>
  <link rel="stylesheet" href="css/site.css">
</head>
<body class="index-page">
  <main class="index-main">
    <header class="index-header">
      <p class="eyebrow">互动编程 · 作业 IP-01</p>
      <h1>几何构成<span class="slash">/</span>交互动态</h1>
      <p class="intro">
        同一套五色配色下的两件作品：一件只用形状、颜色与位置安放画面；
        一件让图形在时间与输入里缓慢生长。
      </p>
    </header>

    <nav class="work-grid">
      <a class="work-card" href="static.html">
        <span class="work-no">01</span>
        <h2>几何构成</h2>
        <p class="work-desc">
          墨蓝竖带撑起结构，珊瑚橙圆作为暖色焦点，湖蓝半圆压住画面底部。
          点阵与方阵由 for 循环生成，全图无 draw() 循环。
        </p>
        <span class="work-meta">静态 · 形状 / 颜色 / 位置</span>
        <span class="work-enter">进入作品 →</span>
      </a>

      <a class="work-card" href="dynamic.html">
        <span class="work-no">02</span>
        <h2>交互动态</h2>
        <p class="work-desc">
          点阵随鼠标起伏成波，同心环缓慢旋转。点击炸开水波，
          空格暂停，N 键在昼与夜之间切换。
        </p>
        <span class="work-meta">动态 · draw() + 3 种交互</span>
        <span class="work-enter">进入作品 →</span>
      </a>
    </nav>

    <footer class="index-footer">数字媒体艺术专业 · 用 p5.js 绘制</footer>
  </main>
</body>
</html>
